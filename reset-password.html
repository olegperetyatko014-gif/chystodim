<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="login.css">

    <title>Новий пароль</title>
</head>

<body>

<div class="container" id="resetContainer">

    <form id="resetForm">

        <h1>Новий пароль</h1>

        <p>Введіть новий пароль для свого акаунту</p>

        <input type="password" id="newPassword" placeholder="Новий пароль">
        <input type="password" id="confirmPassword" placeholder="Повторіть пароль">

        <div class="form-message" id="resetMessage"></div>

        <button type="submit">Зберегти пароль</button>

    </form>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="reset-password.js"></script>

</body>
</html>
