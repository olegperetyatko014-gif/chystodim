<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="login.css">

    <title>Вхід</title>
</head>

<body>

<div class="container" id="container">

    <div class="form-container sign-up">
        <form id="signupForm" novalidate>

            <h1>Створити акаунт</h1>

            <input type="text" id="signupName" placeholder="Ім'я">
<input type="email" id="signupEmail" placeholder="Email@gmail.com">
<input type="password" id="signupPassword" placeholder="Пароль">

            <div class="form-message" id="signupMessage"></div>

            <button type="submit">Зареєструватися</button>

            <p class="mobile-toggle">Вже є акаунт? <a href="#" id="showLogin">Увійти</a></p>

        </form>
    </div>

    <div class="form-container sign-in">
        <form id="loginForm" novalidate>

            <h1>Вхід</h1>

            <input type="email" id="loginEmail" placeholder="Email@gmail.com">
<input type="password" id="loginPassword" placeholder="Пароль">

            <div class="form-message" id="loginMessage"></div>

            <a href="#" id="forgotPasswordBtn">Забули пароль?</a>

            <button type="submit">Увійти</button>

            <p class="mobile-toggle">Немає акаунту? <a href="#" id="showRegister">Зареєструватися</a></p>

        </form>
    </div>

    <div class="toggle-container">

        <div class="toggle">

            <div class="toggle-panel toggle-left">
                <h1>З поверненням!</h1>
                <button class="hidden" id="login">Увійти</button>
            </div>

            <div class="toggle-panel toggle-right">
                <h1>Привіт!</h1>
                <button class="hidden" id="register">Зареєструватися</button>
            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="login.js"></script>

</body>
</html>
